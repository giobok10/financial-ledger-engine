services:
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financial_ledger_backend
    ports:
      - "5171:5000"
    restart: always

  frontend-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financial_ledger_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend-api
    restart: always
